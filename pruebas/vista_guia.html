<!doctype html><html><head><meta charset="utf-8"><base href="../"><title>Vista previa del guía</title></head><body style="margin:0"><script type="module">
// Vista previa del guía y del cartel de felicitación (sin visor)
import * as THREE from './libs/three.module.min.js';
import { Guide } from './guia.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1000, 700); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfe0ea);
scene.add(new THREE.HemisphereLight(0xfff4dc, 0x7fa274, 1.15)); const sun = new THREE.DirectionalLight(0xffe7c2, 0.95); sun.position.set(5, 10, 3); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x80b878, roughness: 1 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const anchor = new THREE.Group(); scene.add(anchor);
const g = new Guide(THREE, anchor, { enabled: () => true, progressEnabled: () => true });
g.place(1.15); g.setVisible(true);
const cam = new THREE.PerspectiveCamera(70, 1000 / 700, 0.05, 80); cam.position.set(0, 1.15, 0);
await document.fonts.ready; await new Promise((res) => setTimeout(res, 800));
const modo = new URLSearchParams(location.search).get('modo') || 'felicita';
if (modo === 'felicita') { g.say('bien_2'); for (let i = 0; i < 20; i++) g.update(0.02); g.setProgress(4, 10, 6, true); cam.lookAt(-0.25, 1.4, -1.2); }
else { g.say('inst_apples_right'); g.update(0.3); cam.position.set(-0.45, 1.25, -0.6); cam.lookAt(-0.56, 1.3, -1.08); }
r.render(scene, cam); window.done = true;
</script></body></html>
